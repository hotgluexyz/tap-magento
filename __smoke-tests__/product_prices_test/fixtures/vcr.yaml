- request:
    body: '{"query": "\n                    query getProducts($current_page: Int,
      $page_size: Int) {\n                        products(\n                            pageSize:
      $page_size\n                            currentPage: $current_page\n                            filter:
      {}\n                        ) {\n                            total_count\n                            page_info
      {\n                                page_size\n                                current_page\n                                total_pages\n                            }\n                            items
      {\n                                \n            id\n            uid\n            name\n            sku\n            url_key\n            type_id\n            price_range
      {\n                minimum_price {\n                    regular_price { value
      currency }\n                    final_price { value currency }\n                    discount
      { amount_off percent_off }\n                }\n                maximum_price
      {\n                    regular_price { value currency }\n                    final_price
      { value currency }\n                }\n            }\n            price_tiers
      {\n                quantity\n                final_price { value currency }\n                discount
      { amount_off percent_off }\n            }\n            ... on ConfigurableProduct
      {\n                variants {\n                    product {\n                        id\n                        uid\n                        sku\n                        name\n                        url_key\n                        type_id\n                        price_range
      {\n                            minimum_price {\n                                regular_price
      { value currency }\n                                final_price { value currency
      }\n                            }\n                        }\n                    }\n                    attributes
      {\n                        label\n                        code\n                        value_index\n                    }\n                }\n            }\n            ...
      on BundleProduct {\n                bundle_items: items {\n                    sku\n                    title\n                    options
      {\n                        label\n                        quantity\n                        product
      {\n                            id\n                            uid\n                            sku\n                            name\n                            url_key\n                            type_id\n                            price_range
      {\n                                minimum_price {\n                                    final_price
      { value currency }\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n    \n                            }\n                        }\n                    }",
      "variables": {"page_size": 150, "current_page": 1}}'
    headers:
      Accept:
      - '*/*'
      Accept-Encoding:
      - gzip, deflate
      Connection:
